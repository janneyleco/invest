  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.k===k);t.setAttribute('aria-selected',t.dataset.k===k)});
  ls(function(){localStorage.setItem(HUB,k)});
  if(location.hash!=='#'+k)history.replaceState(null,'','#'+k);
  document.title={trade:'交易系统',cash:'现金表',news:'新闻中心'}[k]+' · 投资工作台';
}
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){show(t.dataset.k)}});
function note(t){var m=document.getElementById('msg');m.textContent=t;m.style.display='block';setTimeout(function(){m.style.display='none'},2600)}
// 统一备份：一个文件包含三个模块的全部数据
document.getElementById('exp').onclick=function(){
  var p={app:'invest-hub-backup',version:1,exportedAt:new Date().toISOString(),data:{trade:{},cash:{},news:{}}};
  KEYS.trade.forEach(function(k){var v=ls(function(){return localStorage.getItem(k)});if(v!=null)p.data.trade[k]=v});
  KEYS.news.forEach(function(k){var v=ls(function(){return localStorage.getItem(k)});if(v!=null)p.data.news[k]=v});
  ls(function(){for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(CASH_PREFIX)===0)p.data.cash[k]=localStorage.getItem(k)}});
  var n=Object.keys(p.data.trade).length+Object.keys(p.data.cash).length+Object.keys(p.data.news).length;
  if(!n){note('没有可导出的数据');return}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));
  a.download='invest-hub-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
  note('已导出 '+n+' 项数据');
};
var impf=document.getElementById('impf');
document.getElementById('imp').onclick=function(){impf.value='';impf.click()};
impf.onchange=function(){
  var f=impf.files&&impf.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var p=JSON.parse(r.result);
      if(!p||p.app!=='invest-hub-backup'||!p.data)throw 0;
      if(!confirm('导入会覆盖当前三个模块的数据，确定继续吗？'))return;
      ['trade','cash','news'].forEach(function(m){var d=p.data[m]||{};Object.keys(d).forEach(function(k){
        var ok=(m==='cash')?k.indexOf(CASH_PREFIX)===0:KEYS[m].indexOf(k)>=0;
        if(ok)ls(function(){localStorage.setItem(k,d[k])});
      })});
      note('导入成功，正在刷新…');setTimeout(function(){location.reload()},700);
    }catch(e){alert('导入失败：请选择由“总导出”导出的文件')}
  };
  r.readAsText(f);
};
var start=(location.hash||'').slice(1)||ls(function(){return localStorage.getItem(HUB)})||'trade';
if(!frames.trade){var pf=document.createElement('iframe');pf.title='trade';pf.srcdoc=decode('trade');wrap.appendChild(pf);frames.trade=pf;}
show(start);
window.addEventListener('hashchange',function(){var k=location.hash.slice(1);if(APPS.indexOf(k)>=0)show(k)});
})();
</script></body></html>
